<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    color: #fff;
    background: #000;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }
  .bg-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  .bg-layer.active { opacity: 1; }
  .vignette {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 22%, rgba(0,0,0,0.02) 55%, rgba(0,0,0,0.55) 100%),
      linear-gradient(90deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%);
    pointer-events: none;
  }
  .screen {
    position: relative;
    min-height: 100vh;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top-left { max-width: 60%; }
  .time-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: clamp(42px, 6vw, 64px);
    line-height: 1;
    text-shadow: 0 2px 18px rgba(0,0,0,0.4);
  }
  .time-row .secs {
    font-size: 0.32em;
    margin-top: 2px;
    opacity: 0.85;
  }
  .day-line {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 500;
    text-shadow: 0 1px 12px rgba(0,0,0,0.4);
  }
  .date-line {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 300;
    opacity: 0.9;
    text-shadow: 0 1px 12px rgba(0,0,0,0.4);
  }

  .bottom-bar {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }

  .current-panel { min-width: 160px; text-align: left; }
  .mini-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    font-size: 13px;
    font-weight: 400;
    margin-bottom: 6px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
  }
  .mini-row svg { width: 16px; height: 16px; opacity: 0.9; flex-shrink: 0; }

  .temp-line {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin-top: 4px;
  }
  .temp-big {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 56px;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0,0,0,0.45);
  }
  .temp-line svg.wicon { width: 38px; height: 38px; }

  .place-caption {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.85;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }

  .forecast-row {
    display: flex;
    justify-content: flex-start;
    gap: 28px;
    padding-bottom: 4px;
  }
  .forecast-cell {
    text-align: center;
    min-width: 56px;
  }
  .forecast-cell .fc-day {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .forecast-cell svg.wicon {
    width: 30px; height: 30px;
    margin: 8px 0 6px;
  }
  .forecast-cell .fc-temps {
    font-size: 13px;
    font-weight: 500;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .forecast-cell .fc-temps .lo { opacity: 0.65; font-weight: 400; margin-left: 4px; }

  .cities-row {
    display: flex;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.14);
  }
  .city-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 5px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .city-chip .cc-name {
    opacity: 0.75;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10px;
  }
  .city-chip .cc-temp {
    font-weight: 600;
  }

  .credit {
    position: absolute;
    bottom: 14px;
    right: 16px;
    font-size: 10px;
    opacity: 0.6;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  .dev-credit {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.03em;
    opacity: 0.55;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    white-space: nowrap;
  }

  .status-line {
    position: absolute;
    bottom: 14px;
    left: 40px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .device-badge {
    position: absolute;
    top: 78px;
    right: 40px;
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.06em;
    opacity: 0.55;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .device-badge #device-name {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .device-badge #device-meta {
    display: block;
    margin-top: 2px;
    text-transform: uppercase;
  }

  .top-center-stack {
    position: absolute;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 68vw;
  }

  .welcome-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: center;
  }
  .welcome-banner img {
    height: 52px;
    width: auto;
    max-width: 150px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7)) drop-shadow(0 0 3px rgba(0,0,0,0.5));
  }
  .welcome-banner span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.55);
  }

  .news-ticker {
    width: 560px;
    max-width: 78vw;
    height: 34px;
    overflow: hidden;
    background: rgba(10,14,18,0.45);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .nt-track {
    display: flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    width: max-content;
    animation: nt-scroll 46s linear infinite;
  }
  .nt-track.nt-static {
    animation: none;
    width: 100%;
    justify-content: center;
    opacity: 0.75;
  }
  .nt-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 0 28px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .nt-tag {
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 2px;
    font-size: 10.5px;
  }
  .nt-tag.gh { background: rgba(232,163,61,0.75); color: #1a1206; }
  .nt-tag.world { background: rgba(79,168,160,0.75); color: #06201d; }

  @keyframes nt-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @media (max-width: 640px) {
    .top-center-stack {
      position: static;
      transform: none;
      max-width: 100%;
      margin-bottom: 18px;
    }
    .news-ticker {
      width: 100%;
      max-width: 100%;
    }
  }

  .flight-widget {
    position: absolute;
    top: 50%;
    right: 40px;
    transform: translateY(-50%);
    width: 230px;
    max-height: 78vh;
    overflow-y: auto;
    background: rgba(10,14,18,0.45);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .flight-widget::-webkit-scrollbar { width: 4px; }
  .flight-widget::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 2px; }
  .fw-head {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 10px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .fw-list { display: flex; flex-direction: column; gap: 9px; }
  .fw-group-label {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.55;
    margin: 4px 0 -1px;
  }
  .fw-group-label:first-child { margin-top: 0; }
  .fw-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  .fw-row:last-child { border-bottom: none; padding-bottom: 0; }
  .fw-dest {
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .fw-dest .fw-code {
    opacity: 0.6;
    font-size: 10px;
    margin-left: 4px;
  }
  .fw-status {
    text-align: right;
    font-size: 11px;
    opacity: 0.85;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .fw-status .fw-flightno {
    display: block;
    font-size: 10px;
    opacity: 0.65;
    margin-top: 1px;
  }
  .fw-note {
    margin-top: 10px;
    font-size: 9.5px;
    line-height: 1.5;
    opacity: 0.6;
  }

  @media (max-width: 900px) {
    .flight-widget { display: none; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
  }

  @media (max-width: 640px) {
    .screen { padding: 24px 20px; }
    .top-left { max-width: 100%; }
    .forecast-row { gap: 16px; }
    .status-line, .credit, .dev-credit { position: static; margin-top: 16px; transform: none; }
  }
</style>
</head>
<body>

<h1 class="sr-only">Ambient-style dashboard showing the current time, date, and Accra weather over a beach photo background</h1>

<div class="bg-layer" id="bg-a"></div>
<div class="bg-layer" id="bg-b"></div>
<div class="vignette"></div>

<div class="screen">
  <div class="top-center-stack">
    <div class="welcome-banner" id="welcome-banner" style="display:none">
      <img id="welcome-logo" alt="" style="display:none">
      <span id="welcome-text"></span>
    </div>

    <div class="news-ticker" id="news-ticker" style="display:none">
      <div class="nt-track" id="nt-track"></div>
    </div>
  </div>

  <div class="device-badge" id="device-badge" style="display:none">
    <span id="device-name"></span><span id="device-meta"></span>
  </div>

  <div class="flight-widget" id="flight-widget">
    <div class="fw-head">Flights from Accra</div>
    <div class="fw-list" id="flight-list"></div>
    <div class="fw-note" id="flight-note"></div>
  </div>

  <div class="top-left">
    <div class="time-row">
      <span id="hm">--:--</span><span class="secs" id="sec">--</span>
    </div>
    <div class="day-line" id="day-name">-</div>
    <div class="date-line" id="full-date">-</div>
  </div>

  <div class="bottom-bar">
    <div class="current-panel">
      <div class="mini-row" id="wind-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 16h15a3 3 0 1 1-3 3"/></svg>
        <span id="wind">- mph -</span>
      </div>
      <div class="mini-row" id="sunrise-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M12 3v6M5 12H3M21 12h-2M5.6 5.6l1.4 1.4M18.4 5.6 17 7M4 18h16M7 18a5 5 0 0 1 10 0"/></svg>
        <span id="sunrise">--:--</span>
      </div>
      <div class="temp-line">
        <span class="temp-big" id="temp-val">--°</span>
        <span id="temp-icon"></span>
      </div>
      <div class="place-caption" id="condition-text">Loading conditions</div>
    </div>

    <div class="forecast-row" id="forecast-row"></div>

    <div class="cities-row" id="cities-row"></div>
  </div>

  <div class="status-line" id="status-line">Fetching weather data</div>
  <div class="credit" id="credit">Beach sunset — Wikimedia Commons, CC0</div>
  <div class="dev-credit" id="dev-credit"></div>
</div>

    56: "Freezing drizzle", 57: "Dense freezing drizzle",
    61: "Slight rain", 63: "Rain", 65: "Heavy rain",
    66: "Freezing rain", 67: "Heavy freezing rain",
    71: "Slight snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Slight rain showers", 81: "Rain showers", 82: "Violent rain showers",
    85: "Slight snow showers", 86: "Heavy snow showers",
    95: "Thunderstorm", 96: "Thunderstorm, slight hail", 99: "Thunderstorm, heavy hail"
  };

  function weatherIcon(code) {
    const s = 'fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
    if (code === 0 || code === 1) {
      return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    }
    if (code === 2 || code === 3) {
      return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><path d="M7 18a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 12a3.5 3.5 0 0 1-.5 6.9H7Z"/></svg>';
    }
    if ([45,48].includes(code)) {
      return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><path d="M3 10h18M3 14h18M3 18h12"/></svg>';
    }
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) {
      return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><path d="M7 15a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 9a3.5 3.5 0 0 1-.5 6.9H7Z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>';
    }
    if ([71,73,75,77,85,86].includes(code)) {
      return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><path d="M7 15a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 9a3.5 3.5 0 0 1-.5 6.9H7Z"/><path d="M8 19v2M12 19v2M16 19v2"/></svg>';
    }
    if ([95,96,99].includes(code)) {
      return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><path d="M7 14a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 8a3.5 3.5 0 0 1-.5 6.9H7Z"/><path d="M12 15l-2 4h3l-2 4"/></svg>';
    }
    return '<svg class="wicon" viewBox="0 0 24 24" ' + s + '><path d="M7 15a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 9a3.5 3.5 0 0 1-.5 6.9H7Z"/></svg>';
  }

  const DEFAULT_BG_PHOTOS = [
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Beach_sunset_(Unsplash).jpg", credit: "Beach sunset, Málaga — Wikimedia Commons, CC0" },
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Sunset_beach_(Unsplash).jpg", credit: "Sunset beach, Tuakau — Wikimedia Commons, CC0" },
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Sand_beach_at_sunset_(Unsplash).jpg", credit: "Sand beach at sunset, Cascais — Wikimedia Commons, CC0" },
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Sunsetting_Beach_(Unsplash).jpg", credit: "Sunsetting beach, Ocean Beach SF — Wikimedia Commons, CC0" },
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Sunset_beach_1_(Unsplash).jpg", credit: "Sunset beach — Wikimedia Commons, CC0" },
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Venice_beach_at_sunset_(Unsplash).jpg", credit: "Venice Beach at sunset, LA — Wikimedia Commons, CC0" },
    { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Leigh-on-Sea_beach_sunset_(Unsplash).jpg", credit: "Leigh-on-Sea beach sunset, Essex — Wikimedia Commons, CC0" }
  ];
  const BG_PHOTOS = CONFIG.photos && CONFIG.photos.length
    ? CONFIG.photos.map(u => ({ url: u, credit: "Custom photo — set via dashboard CMS" }))
    : DEFAULT_BG_PHOTOS;
  let bgIndex = 0;
  let bgToggle = true;
  const preloaded = {};

  function preload(url) {
    if (preloaded[url]) return preloaded[url];
    const img = new Image();
    img.src = url;
    const p = img.decode ? img.decode().catch(() => {}) : Promise.resolve();
    preloaded[url] = p;
    return p;
  }

  function showBackground(index) {
    const photo = BG_PHOTOS[index];
    const layerA = document.getElementById("bg-a");
    const layerB = document.getElementById("bg-b");
    const incoming = bgToggle ? layerB : layerA;
    const outgoing = bgToggle ? layerA : layerB;

    preload(photo.url).then(() => {
      incoming.style.backgroundImage = "url('" + photo.url + "')";
      incoming.classList.add("active");
      outgoing.classList.remove("active");
      bgToggle = !bgToggle;
      document.getElementById("credit").textContent = photo.credit;
    });

    // Stay two photos ahead so decoding never happens right as a photo is needed
    preload(BG_PHOTOS[(index + 1) % BG_PHOTOS.length].url);
    preload(BG_PHOTOS[(index + 2) % BG_PHOTOS.length].url);
  }

  function rotateBackground() {
    showBackground(bgIndex);
    bgIndex = (bgIndex + 1) % BG_PHOTOS.length;
  }

  rotateBackground();
  setInterval(rotateBackground, CONFIG.interval);

  function pad(n) { return String(n).padStart(2, "0"); }

  const ACCRA_TZ = "Africa/Accra";
  function getAccraParts(now) {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: ACCRA_TZ,
      hour: "numeric", minute: "2-digit", second: "2-digit",
      hour12: true, weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
    const parts = {};
    fmt.formatToParts(now).forEach(p => { parts[p.type] = p.value; });
    return parts;
  }

  function updateClock() {
    const now = new Date();
    const p = getAccraParts(now);
    document.getElementById("hm").textContent = p.hour + ":" + p.minute;
    document.getElementById("sec").textContent = p.second + " " + p.dayPeriod;
    document.getElementById("day-name").textContent = p.weekday + ",";
    document.getElementById("full-date").textContent = p.month + " " + p.day;
  }
  setInterval(updateClock, 1000);
  updateClock();

  if (CONFIG.deviceName) {
    document.getElementById("device-badge").style.display = "block";
    document.getElementById("device-name").textContent = CONFIG.deviceName;
    document.getElementById("device-meta").textContent =
      [CONFIG.deviceType, CONFIG.serial].filter(Boolean).join(" · ");
  }

  if (CONFIG.welcome || CONFIG.logo) {
    document.getElementById("welcome-banner").style.display = "flex";
    if (CONFIG.welcome) {
      document.getElementById("welcome-text").textContent = CONFIG.welcome;
    }
    if (CONFIG.logo) {
      const logoImg = document.getElementById("welcome-logo");
      logoImg.src = CONFIG.logo;
      logoImg.style.display = "block";
    }
  }

  document.getElementById("dev-credit").textContent = CONFIG.devCredit;

  // --- Automatic check-in with the CMS, if this link includes a sync ID ---
  function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h).toString(36).toUpperCase();
  }

  function getDeviceSerial() {
    const raw = [navigator.userAgent, screen.width, screen.height,
      Intl.DateTimeFormat().resolvedOptions().timeZone].join("|");
    return "DASH-" + simpleHash(raw).slice(0, 6);
  }

  function detectDeviceType() {
    const ua = navigator.userAgent || "";
    const platform = navigator.platform || "";
    if (/Tizen|SmartTV|SMART-TV|GoogleTV|WebOS|CrKey|AFT[A-Z]|BRAVIA|HbbTV/i.test(ua)) return "tv";
    if (/iPad/i.test(ua) || (platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ipad";
    if (/Android/i.test(ua) && !/Mobile/i.test(ua)) return "tablet";
    if (/Windows/i.test(ua)) return "windows";
    return "other";
  }

  async function checkInDevice() {
    if (!CONFIG.sync) return;
    if (window.location.protocol === "file:") {
      console.warn("Skipping device check-in: this page is open from a local file, not a hosted URL.");
      return;
    }
    try {
      const base = "https://kvdb.io/" + CONFIG.sync + "/registry";
      const serial = getDeviceSerial();

      let registry = {};
      try {
        const res = await fetch(base);
        if (res.ok) registry = await res.json();
      } catch (e) { /* first check-in, key may not exist yet */ }

      const existing = registry[serial] || {};
      registry[serial] = {
        name: existing.name || CONFIG.deviceName || "",
        type: existing.type || CONFIG.deviceType || detectDeviceType(),
        lastSeen: Date.now()
      };

      await fetch(base, { method: "POST", body: JSON.stringify(registry) });
    } catch (err) {
      console.warn("Device check-in failed:", err);
    }
  }
  checkInDevice();
  setInterval(checkInDevice, 120000);

  function windDir(deg) {
    const dirs = ["N","NE","E","SE","S","SW","W","NW"];
    return dirs[Math.round(deg / 45) % 8];
  }

  function setStatus(msg) {
    document.getElementById("status-line").textContent = msg;
  }

  async function loadWeather(lat, lon, placeName) {
    setStatus("Fetching weather data");
    try {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
        "&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m" +
        "&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise" +
        "&wind_speed_unit=" + CONFIG.windUnit + "&temperature_unit=" + CONFIG.unit + "&timezone=auto";
      const res = await fetch(url);
      if (!res.ok) throw new Error("Weather request failed");
      const data = await res.json();
      const c = data.current;

      document.getElementById("temp-val").textContent = Math.round(c.temperature_2m) + "°";
      document.getElementById("temp-icon").innerHTML = weatherIcon(c.weather_code);
      document.getElementById("condition-text").textContent = (WEATHER_CODES[c.weather_code] || "Conditions unknown") + " · " + placeName;
      document.getElementById("wind").textContent = Math.round(c.wind_speed_10m) + (CONFIG.windUnit === "kmh" ? " km/h " : " mph ") + windDir(c.wind_direction_10m);

      if (data.daily && data.daily.sunrise && data.daily.sunrise[0]) {
        const sr = new Date(data.daily.sunrise[0]);
        document.getElementById("sunrise").textContent = sr.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      if (data.daily) renderForecast(data.daily);

      const now = new Date();
      setStatus("Updated " + now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    } catch (err) {
      setStatus("Weather unavailable — check connection");
    }
  }

  function renderForecast(daily) {
    const dayLabels = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
    const row = document.getElementById("forecast-row");
    row.innerHTML = "";
    const count = Math.min(4, daily.time.length);
    for (let i = 0; i < count; i++) {
      const d = new Date(daily.time[i] + "T12:00:00");
      const label = i === 0 ? "TODAY" : dayLabels[d.getDay()];
      const hi = Math.round(daily.temperature_2m_max[i]);
      const lo = Math.round(daily.temperature_2m_min[i]);
      const code = daily.weather_code[i];

      const cell = document.createElement("div");
      cell.className = "forecast-cell";
      cell.innerHTML =
        "<div class=\"fc-day\">" + label + "</div>" +
        weatherIcon(code) +
        "<div class=\"fc-temps\">" + hi + "<span class=\"lo\">" + lo + "</span></div>";
      row.appendChild(cell);
    }
  }

  async function geocodeCity(name) {
    setStatus("Searching for " + name);
    try {
      const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=1";
      const res = await fetch(url);
      const data = await res.json();
      if (data.results && data.results.length) {
        const r = data.results[0];
        const label = r.name + (r.country_code ? ", " + r.country_code : "");
        loadWeather(r.latitude, r.longitude, label);
      } else {
        setStatus("No matching location found");
      }
    } catch (err) {
      setStatus("Search failed — check connection");
    }
  }

  if (CONFIG.city) {
    geocodeCity(CONFIG.city);
  } else {
    loadWeather(CONFIG.lat, CONFIG.lon, CONFIG.place);
  }

  // --- Flight widget: Accra (ACC) to local Ghana airports and international hubs ---
  const LOCAL_DESTS = [
    { label: "Kumasi", code: "KMS" },
    { label: "Sunyani", code: "NYI" },
    { label: "Tamale", code: "TML" },
    { label: "Ho", code: "HZO" },
    { label: "Wa", code: "WZA" },
    { label: "Takoradi", code: "TKD" }
  ];
  const INTL_DESTS = [
    { label: "USA", code: "JFK" },
    { label: "Canada", code: "YYZ" },
    { label: "UK", code: "LHR" },
    { label: "Australia", code: "SYD" },
    { label: "Germany", code: "FRA" },
    { label: "France", code: "CDG" },
    { label: "Amsterdam", code: "AMS" }
  ];

  const FLIGHT_GROUPS = [];
  if (CONFIG.showLocalFlights) FLIGHT_GROUPS.push({ title: "Domestic", dests: LOCAL_DESTS });
  if (CONFIG.showIntlFlights) FLIGHT_GROUPS.push({ title: "International", dests: INTL_DESTS });

  function groupRowsHTML(dests, statusFor) {
    return dests.map(d =>
      '<div class="fw-row"><span class="fw-dest">' + d.label +
      '<span class="fw-code">' + d.code + '</span></span>' +
      (statusFor ? statusFor(d) : '<span class="fw-status">—</span>') +
      '</div>'
    ).join("");
  }

  function renderFlightGroups(statusFor) {
    const list = document.getElementById("flight-list");
    if (!FLIGHT_GROUPS.length) {
      list.innerHTML = "";
      return;
    }
    list.innerHTML = FLIGHT_GROUPS.map(g =>
      (FLIGHT_GROUPS.length > 1 ? '<div class="fw-group-label">' + g.title + '</div>' : '') +
      groupRowsHTML(g.dests, statusFor)
    ).join("");
  }

  function renderFlightPlaceholder(note) {
    renderFlightGroups(null);
    document.getElementById("flight-note").textContent = note;
  }

  async function loadFlights() {
    if (!FLIGHT_GROUPS.length) {
      document.getElementById("flight-widget").style.display = "none";
      return;
    }
    if (!CONFIG.flightKey) {
      renderFlightPlaceholder("Add a free AviationStack API key in the CMS to show live flight status here.");
      return;
    }
    renderFlightPlaceholder("Loading live flights…");
    try {
      // One request covering all departures from Accra, then match against
      // every destination across both groups — keeps this to a single API
      // call against what's usually a limited free-tier quota.
      const url = "https://api.aviationstack.com/v1/flights?access_key=" +
        encodeURIComponent(CONFIG.flightKey) + "&dep_iata=ACC&limit=100";
      const res = await fetch(url);
      if (!res.ok) throw new Error("status " + res.status);
      const data = await res.json();
      const flights = (data && data.data) || [];

      const statusFor = (d) => {
        const match = flights.find(f => f.arrival && f.arrival.iata === d.code);
        if (!match) return '<span class="fw-status">No flight found</span>';
        const flightNo = (match.flight && (match.flight.iata || match.flight.number)) || "";
        const airline = (match.airline && match.airline.name) || "";
        const sched = match.departure && match.departure.scheduled
          ? new Date(match.departure.scheduled).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
          : "—";
        const statusText = (match.flight_status || "scheduled").replace(/^\w/, c => c.toUpperCase());
        return '<span class="fw-status">' + statusText + ' · ' + sched +
          (flightNo ? '<span class="fw-flightno">' + airline + ' ' + flightNo + '</span>' : '') +
          '</span>';
      };

      renderFlightGroups(statusFor);
      document.getElementById("flight-note").textContent = "Live data via AviationStack";
    } catch (err) {
      renderFlightPlaceholder("Couldn't load live flights right now.");
    }
  }
  loadFlights();

  // --- Extra cities row: quick current temps for a few other Ghana cities ---
  const OTHER_CITIES = [
    { name: "Kumasi", lat: 6.6885, lon: -1.6244 },
    { name: "Ho", lat: 6.6009, lon: 0.4713 },
    { name: "Tamale", lat: 9.4008, lon: -0.8393 },
    { name: "Sunyani", lat: 7.3399, lon: -2.3268 }
  ];

  async function loadOtherCities() {
    if (!CONFIG.showCities) {
      document.getElementById("cities-row").style.display = "none";
      return;
    }
    const row = document.getElementById("cities-row");
    try {
      const results = await Promise.all(OTHER_CITIES.map(async (city) => {
        try {
          const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
            "&current=temperature_2m&temperature_unit=" + CONFIG.unit
          );
          if (!res.ok) throw new Error("bad status");
          const data = await res.json();
          const temp = data && data.current ? Math.round(data.current.temperature_2m) : null;
          return { name: city.name, temp };
        } catch (err) {
          return { name: city.name, temp: null };
        }
      }));

      row.innerHTML = results.map(r =>
        '<div class="city-chip"><span class="cc-name">' + r.name + '</span>' +
        '<span class="cc-temp">' + (r.temp !== null ? r.temp + "°" : "—") + '</span></div>'
      ).join("");
    } catch (err) {
      row.style.display = "none";
    }
  }
  loadOtherCities();

  // --- News ticker: free headlines from Ghana and around the world via RSS ---
  // Two sources per region, each tried through two independent free methods,
  // so neither a dead feed nor a down conversion service takes the whole thing out.
  const NEWS_FEEDS = [
    { tag: "gh", label: "GHANA", rss: "https://www.myjoyonline.com/feed/" },
    { tag: "gh", label: "GHANA", rss: "https://www.graphic.com.gh/news.feed" },
    { tag: "world", label: "WORLD", rss: "https://feeds.bbci.co.uk/news/world/rss.xml" },
    { tag: "world", label: "WORLD", rss: "https://feeds.bbci.co.uk/news/world/africa/rss.xml" }
  ];

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function setTickerMessage(text) {
    const track = document.getElementById("nt-track");
    track.classList.add("nt-static");
    track.innerHTML = '<span class="nt-item">' + escapeHtml(text) + '</span>';
    document.getElementById("news-ticker").style.display = "block";
  }

  // Method 1: rss2json.com — free, keyless RSS-to-JSON conversion.
  async function fetchViaRss2Json(rssUrl) {
    const url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl) + "&count=5";
    const res = await fetch(url);
    if (!res.ok) throw new Error("rss2json bad status " + res.status);
    const data = await res.json();
    const items = (data && data.status === "ok" && data.items) || [];
    const titles = items.map(item => item.title).filter(Boolean);
    if (!titles.length) throw new Error("rss2json returned no items");
    return titles;
  }

  // Method 2: fetch the raw RSS/XML through a free CORS proxy and parse it
  // directly in the browser — independent of rss2json, so if that service is
  // ever down, this still gets real headlines from the same free public feeds.
  async function fetchViaRawXml(rssUrl) {
    const proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(rssUrl);
    const res = await fetch(proxied);
    if (!res.ok) throw new Error("proxy bad status " + res.status);
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, "application/xml");
    const titles = Array.from(doc.querySelectorAll("item > title"))
      .slice(0, 5)
      .map(el => (el.textContent || "").trim())
      .filter(Boolean);
    if (!titles.length) throw new Error("no items parsed from feed");
    return titles;
  }

  async function loadNews() {
    const ticker = document.getElementById("news-ticker");
    if (!CONFIG.showNews) {
      ticker.style.display = "none";
      return;
    }

    setTickerMessage("Loading headlines…");

    // Try each feed, keeping the first successful result per region (tag) so a
    // dead primary source falls back to its backup rather than showing nothing.
    const byTag = {};
    let anyReachable = false;
    await Promise.all(NEWS_FEEDS.map(async (feed) => {
      if (byTag[feed.tag] && byTag[feed.tag].length) return; // already have this region covered
      let titles = [];
      try {
        titles = await fetchViaRss2Json(feed.rss);
        anyReachable = true;
      } catch (err) {
        try {
          titles = await fetchViaRawXml(feed.rss);
          anyReachable = true;
        } catch (err2) {
          // both free methods failed for this particular feed — another feed
          // with the same tag, if any, still gets its own chance above
        }
      }
      if (titles.length) {
        byTag[feed.tag] = titles.map(title => ({ tag: feed.tag, label: feed.label, title }));
      }
    }));

    const headlines = Object.values(byTag).flat();

    if (!headlines.length) {
      setTickerMessage(
        anyReachable
          ? "No headlines available right now — feeds may be temporarily down."
          : "Couldn't reach the news service — check your connection."
      );
      return;
    }

    const itemsHTML = headlines.map(h =>
      '<span class="nt-item"><span class="nt-tag ' + h.tag + '">' + h.label + '</span>' +
      escapeHtml(h.title) + '</span>'
    ).join("");
    // Duplicate the sequence so the looping animation has no visible seam
    const track = document.getElementById("nt-track");
    track.classList.remove("nt-static");
    track.innerHTML = itemsHTML + itemsHTML;
    ticker.style.display = "block";
  }
  loadNews();
</script>
